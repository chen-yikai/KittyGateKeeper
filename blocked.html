<!doctype html>
<html>
  <head>
    <title>Access Blocked - ZeroAiCatcher</title>
    <meta charset="UTF-8">
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      
      .container {
        text-align: center;
        background: white;
        padding: 60px 40px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 500px;
      }
      
      .icon {
        font-size: 80px;
        margin-bottom: 20px;
      }
      
      h1 {
        color: #667eea;
        font-size: 32px;
        margin: 0 0 20px 0;
        font-weight: bold;
      }
      
      p {
        color: #666;
        font-size: 18px;
        line-height: 1.6;
        margin: 0 0 30px 0;
      }
      
      .blocked-site {
        background: #f5f5f5;
        padding: 15px;
        border-radius: 8px;
        color: #333;
        font-family: monospace;
        font-size: 14px;
        word-break: break-all;
        margin-bottom: 20px;
      }
      
      .suggestion {
        color: #67c895;
        font-weight: bold;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">🚫</div>
      <h1>Access Blocked</h1>
      <p>This site has been blocked by ZeroAiCatcher</p>
      <div class="blocked-site" id="blocked-url">Loading...</div>
      <p class="suggestion">✨ Try using Google Search instead!</p>
    </div>
    
    <script>
      // Get the URL that was blocked from the referrer or display a generic message
      const params = new URLSearchParams(window.location.search);
      const blockedUrl = params.get('url') || 'Unknown site';
      document.getElementById('blocked-url').textContent = blockedUrl;
    </script>
  </body>
</html>

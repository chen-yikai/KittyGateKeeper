<!doctype html>
<html>
  <head>
    <title>網站已被封鎖 - KittyGateKeeper</title>
    <meta charset="UTF-8">
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Microsoft JhengHei', 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      
      .container {
        text-align: center;
        background: white;
        padding: 50px 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        max-width: 450px;
      }
      
      .icon {
        font-size: 70px;
        margin-bottom: 15px;
      }
      
      h1 {
        color: #ff6b9d;
        font-size: 28px;
        margin: 0 0 15px 0;
        font-weight: bold;
      }
      
      p {
        color: #666;
        font-size: 16px;
        line-height: 1.5;
        margin: 0 0 20px 0;
      }
      
      .blocked-site {
        background: #f5f5f5;
        padding: 12px;
        border-radius: 8px;
        color: #333;
        font-size: 13px;
        word-break: break-all;
        margin-bottom: 15px;
      }
      
      .suggestion {
        color: #67c895;
        font-weight: bold;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">🐱🚫</div>
      <h1>網站已被封鎖</h1>
      <p>此網站已被 KittyGateKeeper 阻擋</p>
      <div class="blocked-site" id="blocked-url">載入中...</div>
      <p class="suggestion">✨ 建議使用 Google 搜尋！</p>
    </div>
    
    <script>
      const params = new URLSearchParams(window.location.search);
      const blockedUrl = params.get('url') || '未知網站';
      document.getElementById('blocked-url').textContent = blockedUrl;
    </script>
  </body>
</html>
